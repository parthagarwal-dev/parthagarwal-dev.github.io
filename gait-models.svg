<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">Dual-dataset gait analysis</title><desc id="d">The published study analyzes GAVD joint features with a one-dimensional CNN-LSTM and OU-MVLP silhouettes with a three-dimensional CNN-LSTM, using SHAP and Grad-CAM for interpretation.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#837582" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#f7f5f7"/><text x="32" y="34" font-family="Arial, sans-serif" font-size="14" letter-spacing="1" fill="#782b3c">DUAL-DATASET GAIT ANALYSIS</text><rect x="32" y="70" width="195" height="68" rx="7" fill="#fff" stroke="#d7cfd7"/><text x="129.5" y="98.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">GAVD</text><text x="129.5" y="121.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">Joint-based features</text><rect x="32" y="184" width="195" height="68" rx="7" fill="#fff" stroke="#d7cfd7"/><text x="129.5" y="212.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">OU-MVLP</text><text x="129.5" y="235.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">Silhouette sequences</text><rect x="283" y="70" width="193" height="68" rx="7" fill="#782b3c" stroke="#782b3c"/><text x="379.5" y="110.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff">1D CNN-LSTM</text><rect x="283" y="184" width="193" height="68" rx="7" fill="#782b3c" stroke="#782b3c"/><text x="379.5" y="224.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff">3D CNN-LSTM</text><rect x="532" y="70" width="195" height="68" rx="7" fill="#fff" stroke="#d7cfd7"/><text x="629.5" y="98.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">SHAP</text><text x="629.5" y="121.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">Temporal attribution</text><rect x="532" y="184" width="195" height="68" rx="7" fill="#fff" stroke="#d7cfd7"/><text x="629.5" y="212.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">Grad-CAM</text><text x="629.5" y="235.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">Spatial localization</text><path d="M227,104 L277,104" fill="none" stroke="#837582" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M476,104 L526,104" fill="none" stroke="#837582" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M227,218 L277,218" fill="none" stroke="#837582" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M476,218 L526,218" fill="none" stroke="#837582" stroke-width="1.5" marker-end="url(#arrow)"/><text x="32" y="304" font-family="Arial, sans-serif" font-size="15" fill="#625766">Model and explanation overview · ICMLA 2025</text></svg>