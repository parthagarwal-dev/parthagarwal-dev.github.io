<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">Verifiable scientific-agent workflow</title><desc id="d">A scientific request is compiled into a typed plan, executed through registered capabilities, and assessed by an independent verifier. Failed checks trigger recovery.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#837582" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#f7f5f7"/><text x="32" y="34" font-family="Arial, sans-serif" font-size="14" letter-spacing="1" fill="#782b3c">SCIENTIFIC INTENT → CHECKED RESULTS</text><rect x="32" y="66" width="180" height="64" rx="7" fill="#fff" stroke="#d7cfd7"/><text x="122.0" y="104.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">Scientific request</text><rect x="286" y="66" width="180" height="64" rx="7" fill="#fff" stroke="#d7cfd7"/><text x="376.0" y="104.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">Typed plan</text><rect x="548" y="66" width="180" height="64" rx="7" fill="#fff" stroke="#d7cfd7"/><text x="638.0" y="92.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">Registered</text><text x="638.0" y="115.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">capabilities</text><path d="M212,98 L280,98" fill="none" stroke="#837582" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M466,98 L542,98" fill="none" stroke="#837582" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M638,130 L638,203" fill="none" stroke="#837582" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="548" y="210" width="180" height="68" rx="7" fill="#fff" stroke="#d7cfd7"/><text x="638.0" y="238.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">Execution</text><text x="638.0" y="261.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">and provenance</text><rect x="286" y="210" width="180" height="68" rx="7" fill="#782b3c" stroke="#782b3c"/><text x="376.0" y="238.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff">Independent</text><text x="376.0" y="261.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff">verification</text><rect x="32" y="210" width="180" height="68" rx="7" fill="#fff" stroke="#d7cfd7"/><text x="122.0" y="250.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">Authorized result</text><path d="M548,244 L472,244" fill="none" stroke="#837582" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M286,244 L218,244" fill="none" stroke="#837582" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M376,210 L376,156 L286,156 L286,135" fill="none" stroke="#a9909b" stroke-dasharray="5 4" stroke-width="1.4" marker-end="url(#arrow)"/><text x="304" y="180" font-family="Arial, sans-serif" font-size="14" fill="#625766">Recovery</text></svg>