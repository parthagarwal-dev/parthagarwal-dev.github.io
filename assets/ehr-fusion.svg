<title id="t">Five-source EHR modeling for hyponatremia prediction</title><desc id="d">Laboratory measurements, note metadata, medications, clinical codes, and visits enter modality-specific representations and masked-attention fusion. The evaluated setup uses note metadata rather than narrative clinical text.</desc>
