<svg xmlns="http://www.w3.org/2000/svg" width="760" height="340" viewBox="0 0 760 340" role="img" aria-labelledby="t d"><title id="t">Multimodal EHR modeling</title><desc id="d">Clinical time series and clinical text pass through modality-specific encoders before masked-attention fusion and clinical prediction. Missing-modality handling and reliability analysis are explicit parts of the pipeline.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0,0 L7,3.5 L0,7" fill="none" stroke="#837582" stroke-width="1.2"/></marker></defs><rect width="100%" height="100%" fill="#f7f5f7"/><text x="32" y="34" font-family="Arial, sans-serif" font-size="14" letter-spacing="1" fill="#782b3c">MULTIMODAL CLINICAL LEARNING</text><rect x="32" y="68" width="168" height="65" rx="7" fill="#fff" stroke="#d7cfd7"/><text x="116.0" y="106.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">EHR time series</text><rect x="32" y="172" width="168" height="65" rx="7" fill="#fff" stroke="#d7cfd7"/><text x="116.0" y="210.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">Clinical text</text><rect x="238" y="68" width="168" height="65" rx="7" fill="#fff" stroke="#d7cfd7"/><text x="322.0" y="95.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">Time-series</text><text x="322.0" y="118.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">encoder</text><rect x="238" y="172" width="168" height="65" rx="7" fill="#fff" stroke="#d7cfd7"/><text x="322.0" y="210.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">Text encoder</text><path d="M200,100 L232,100" fill="none" stroke="#837582" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M200,204 L232,204" fill="none" stroke="#837582" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="475" y="112" width="237" height="80" rx="7" fill="#782b3c" stroke="#782b3c"/><text x="593.5" y="146.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff">Masked-attention</text><text x="593.5" y="169.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#fff">fusion</text><path d="M406,100 L440,100 L440,140 L469,140 M406,204 L440,204 L440,164 L469,164" fill="none" stroke="#837582" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M593,192 L593,249" fill="none" stroke="#837582" stroke-width="1.5" marker-end="url(#arrow)"/><rect x="475" y="256" width="237" height="50" rx="7" fill="#fff" stroke="#d7cfd7"/><text x="593.5" y="287.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" fill="#342d36">Clinical prediction</text><text x="32" y="292" font-family="Arial, sans-serif" font-size="15" fill="#625766">Missing inputs · Attribution · Calibration</text></svg>